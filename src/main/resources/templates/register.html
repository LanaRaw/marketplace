<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">

<body>

<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">
                        Регистрация
                    </h4>
                </div>

                <div class="card-body">
                    <div th:if="${error}"
                         class="alert alert-danger"
                         th:text="${error}">
                        Ошибка
                    </div>

                    <form th:action="@{/register}"
                          method="post">
                        <div class="mb-3">
                            <label for="username"
                                   class="form-label">
                                Имя пользователя
                            </label>
                            <input
                                    type="text"
                                    class="form-control"
                                    id="username"
                                    name="username"
                                    required>
                        </div>

                        <div class="mb-3">
                            <label for="email"
                                   class="form-label">
                                Email
                            </label>
                            <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    required>
                        </div>

                        <div class="mb-3">
                            <label for="password"
                                   class="form-label">
                                Пароль
                            </label>
                            <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    required>
                        </div>
                        <button
                                type="submit"
                                class="btn btn-success w-100">
                            Зарегистрироваться
                        </button>
                    </form>

                    <div class="mt-3 text-center">
                        <p>
                            Уже есть аккаунт?
                            <a th:href="@{/login}">
                                Войти
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
