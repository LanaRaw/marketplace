<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">

<body>

<div th:fragment="content">

    <div class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <span class="auth-label">
                    Account
                </span>

                <h1 class="auth-title">
                    Регистрация
                </h1>

                <p class="auth-subtitle">
                    Создайте аккаунт, чтобы пользоваться маркетплейсом.
                </p>

            </div>

            <div th:if="${error}"
                 class="auth-alert auth-alert-error"
                 th:text="${error}">
                Ошибка
            </div>

            <form th:action="@{/register}"
                  method="post"
                  class="auth-form">

                <div class="auth-field">

                    <label for="username"
                           class="auth-label-text">
                        Имя пользователя
                    </label>

                    <input type="text"
                           class="form-control auth-input"
                           id="username"
                           name="username"
                           required>

                </div>

                <div class="auth-field">

                    <label for="email"
                           class="auth-label-text">
                        Email
                    </label>

                    <input type="email"
                           class="form-control auth-input"
                           id="email"
                           name="email"
                           required>

                </div>

                <div class="auth-field">

                    <label for="password"
                           class="auth-label-text">
                        Пароль
                    </label>

                    <input type="password"
                           class="form-control auth-input"
                           id="password"
                           name="password"
                           required>

                </div>

                <button type="submit"
                        class="auth-submit">
                    Зарегистрироваться
                </button>

            </form>

            <div class="auth-footer">
                Уже есть аккаунт?
                <a th:href="@{/login}">
                    Войти
                </a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
