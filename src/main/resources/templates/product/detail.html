<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">

<body>

<div th:fragment="content">

    <div class="row">
        <div class="col-md-5">
            <img th:src="${product.imageUrl}"
                 class="img-fluid rounded shadow"
                 alt="">
        </div>

        <div class="col-md-7">
            <h1 th:text="${product.name}">Название</h1>
            <p class="text-muted" th:text="'Категория: ' + ${product.category}">Категория</p>

            <h3 class="text-success" th:text="'$' + ${product.price}">$99.99</h3>

            <p class="mt-3" th:text="${product.description}">Описание</p>

            <p class="mt-2">
                <strong>В наличии:</strong>
                <span th:text="${product.quantityInStock}">10</span>
            </p>

            <div class="mt-4 d-flex gap-2">
                <form th:action="@{/cart/add}" method="post">
                    <input type="hidden" name="productId" th:value="${product.id}">
                    <input type="number" name="quantity" value="1" min="1" max="99"
                           class="form-control" style="width: 80px; display: inline-block;">
                    <button type="submit" class="btn btn-success">Добавить в корзину</button>
                </form>

                <a th:href="@{/products}" class="btn btn-secondary">Назад к товарам</a>
            </div>
        </div>
    </div>

</div>

</body>
</html>
