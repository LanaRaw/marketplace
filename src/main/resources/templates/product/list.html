<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">

<body>

<div th:fragment="content">

    <div class="products-page">

        <header class="products-header">
            <div>
                <div class="products-label">Marketplace</div>

                <h1 class="products-title">
                    Все товары
                </h1>

                <p class="products-subtitle">
                    Найдите то, что вам нужно
                </p>
            </div>
        </header>

        <section class="filters-panel">

            <form th:action="@{/products}"
                  method="get"
                  class="filter-form">

                <input type="text"
                       name="search"
                       class="form-control filter-input"
                       placeholder="Поиск товаров..."
                       th:value="${search}">

                <button type="submit"
                        class="filter-button">
                    Найти
                </button>

            </form>

            <form th:action="@{/products}"
                  method="get"
                  class="filter-form">

                <select name="category"
                        class="form-select filter-select">

                    <option value="">
                        Все категории
                    </option>

                    <option th:each="cat : ${categories}"
                            th:value="${cat}"
                            th:text="${cat}"
                            th:selected="${selectedCategory == cat}">
                    </option>

                </select>

                <button type="submit"
                        class="filter-button">
                    Фильтр
                </button>

            </form>

            <a th:href="@{/products}"
               class="reset-button">
                Сбросить
            </a>

        </section>

        <div th:if="${products.isEmpty()}"
             class="empty-products">

            <div class="empty-products-icon">
                ⌕
            </div>

            <div class="empty-products-title">
                Товаров не найдено
            </div>

            <div>
                Попробуйте изменить поисковый запрос или категорию.
            </div>

        </div>

        <div class="products-grid"
             th:unless="${products.isEmpty()}">

            <article th:each="product : ${products}"
                     class="product-card">

                <a th:href="@{/products/{id}(id=${product.id})}"
                   class="product-image-wrapper">

                    <img th:src="@{'/uploads/' + ${product.imagePath}}"
                         class="product-image"
                         alt=""
                         loading="lazy">

                </a>

                <div class="product-card-body">

                    <h2 class="product-name"
                        th:text="${product.name}">
                        Название
                    </h2>

                    <p class="product-description"
                       th:text="${product.description}">
                        Описание
                    </p>

                    <div class="product-price"
                         th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}">
                        $99.99
                    </div>

                    <form th:action="@{/cart/add}"
                          method="post"
                          class="cart-form">

                        <input type="hidden"
                               name="productId"
                               th:value="${product.id}">

                        <div class="quantity-control">

                            <button type="button"
                                    class="quantity-button"
                                    onclick="this.nextElementSibling.stepDown()"
                                    aria-label="Уменьшить количество">
                                −
                            </button>

                            <input type="number"
                                   name="quantity"
                                   value="1"
                                   min="1"
                                   max="99"
                                   class="quantity-input"
                                   aria-label="Количество">

                            <button type="button"
                                    class="quantity-button"
                                    onclick="this.previousElementSibling.stepUp()"
                                    aria-label="Увеличить количество">
                                +
                            </button>

                        </div>

                        <button type="submit"
                                class="primary-button cart-button">
                            В корзину
                            <span>→</span>
                        </button>

                    </form>

                    <a th:href="@{/products/{id}(id=${product.id})}"
                       class="product-link">
                        Подробнее
                    </a>

                </div>

            </article>

        </div>

        <nav th:if="${totalPages > 1}"
             class="pagination-wrapper"
             aria-label="Навигация по страницам">

            <ul class="pagination products-pagination">

                <li class="page-item"
                    th:classappend="${currentPage == 0} ? 'disabled' : ''">

                    <a class="page-link"
                       th:href="@{/products(page=${currentPage - 1}, size=${size}, search=${search}, category=${selectedCategory})}"
                       aria-label="Предыдущая">
                        &laquo;
                    </a>

                </li>

                <li class="page-item"
                    th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${i == currentPage} ? 'active' : ''">

                    <a class="page-link"
                       th:href="@{/products(page=${i}, size=${size}, search=${search}, category=${selectedCategory})}"
                       th:text="${i + 1}">
                    </a>

                </li>

                <li class="page-item"
                    th:classappend="${currentPage == totalPages - 1} ? 'disabled' : ''">

                    <a class="page-link"
                       th:href="@{/products(page=${currentPage + 1}, size=${size}, search=${search}, category=${selectedCategory})}"
                       aria-label="Следующая">
                        &raquo;
                    </a>

                </li>

            </ul>

        </nav>

    </div>

</div>

</body>
</html>
