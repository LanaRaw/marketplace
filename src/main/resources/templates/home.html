<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">

<body>

<div th:fragment="content">

    <section class="hero-section">

        <div class="hero-content">

            <span class="hero-label">MARKETPLACE</span>

            <h1 class="hero-title">
                Всё нужное.
                <span>В одном месте.</span>
            </h1>

            <p class="hero-description">
                Найдите товары от проверенных продавцов
                и выберите то, что подходит именно вам.
            </p>

            <div class="hero-actions">
                <a th:href="@{/products}" class="primary-button">
                    Смотреть товары
                    <span>→</span>
                </a>
            </div>

        </div>

    </section>

    <section class="products-section">

        <div class="section-header">

            <div>
                <span class="section-label">DISCOVER</span>
                <h2 class="section-title">Новинки</h2>
            </div>

            <a th:href="@{/products}" class="section-link">
                Все товары
                <span>→</span>
            </a>

        </div>

        <div th:if="${latestProducts.isEmpty()}"
             class="empty-products">

            <h3 class="empty-products-title">
                Пока здесь ничего нет
            </h3>

            <p class="empty-products-text">
                Новые товары появятся совсем скоро.
            </p>

        </div>

        <div class="products-grid"
             th:unless="${latestProducts.isEmpty()}">

            <article class="product-card"
                     th:each="product : ${latestProducts}">

                <a th:href="@{/products/{id}(id=${product.id})}"
                   class="product-image-wrapper">

                    <img th:src="${product.imageUrl}"
                         class="product-image"
                         alt=""
                         loading="lazy">

                    <span class="product-arrow">↗</span>

                </a>

                <div class="product-card-body">

                    <h3 class="product-name"
                        th:text="${product.name}">
                        Название
                    </h3>

                    <p class="product-description"
                       th:text="${product.description}">
                        Описание
                    </p>

                    <div class="product-card-footer">

                        <strong class="product-price"
                                th:text="'$' + ${product.price}">
                            $99.99
                        </strong>

                    </div>

                    <div class="product-card-actions">

                        <form th:action="@{/cart/add}"
                              method="post"
                              class="home-cart-form">

                            <input type="hidden"
                                   name="productId"
                                   th:value="${product.id}">

                            <input type="hidden"
                                   name="quantity"
                                   value="1">

                            <button type="submit"
                                    class="primary-button home-cart-button">
                                В корзину
                                <span>→</span>
                            </button>

                        </form>

                        <a th:href="@{/products/{id}(id=${product.id})}"
                           class="product-link">
                            Подробнее
                        </a>

                    </div>

                </div>

            </article>

        </div>

    </section>

</div>

</body>
</html>
