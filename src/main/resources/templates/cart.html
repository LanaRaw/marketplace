<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">

<body>

<div th:fragment="content">

    <h1 class="mb-4">
        Корзина
    </h1>


    <!-- Корзина пуста -->
    <div th:if="${items.isEmpty()}">

        <div class="alert alert-info">
            Ваша корзина пуста
        </div>

        <a th:href="@{/products}"
           class="btn btn-primary">

            Перейти к товарам

        </a>

    </div>


    <!-- Корзина содержит товары -->
    <div th:unless="${items.isEmpty()}">

        <table class="table table-striped">

            <thead>

            <tr>
                <th>Товар</th>
                <th>Цена</th>
                <th>Количество</th>
                <th>Сумма</th>
                <th>Действие</th>
            </tr>

            </thead>


            <tbody>

            <tr th:each="item : ${items}">

                <td th:text="${item.productName}">
                    Товар
                </td>


                <td th:text="${'$' + item.price}">
                    $99.99
                </td>


                <td>

                    <form
                            th:action="@{/cart/update}"
                            method="post"
                            class="d-flex gap-2">

                        <input
                                type="hidden"
                                name="productId"
                                th:value="${item.productId}">

                        <input
                                type="number"
                                name="quantity"
                                th:value="${item.quantity}"
                                min="1"
                                max="99"
                                class="form-control"
                                style="width: 80px;">

                        <button
                                type="submit"
                                class="btn btn-sm btn-primary">

                            Обновить

                        </button>

                    </form>

                </td>


                <td th:text="${'$' + item.total}">
                    $199.98
                </td>


                <td>

                    <form
                            th:action="@{/cart/remove/{id}(id=${item.productId})}"
                            method="post">

                        <button
                                type="submit"
                                class="btn btn-sm btn-danger">

                            Удалить

                        </button>

                    </form>

                </td>

            </tr>

            </tbody>


            <tfoot>

            <tr>

                <th colspan="3">
                    Итого:
                </th>

                <th th:text="${'$' + total}">
                    $0.00
                </th>

                <th>

                    <form
                            th:action="@{/cart/clear}"
                            method="post">

                        <button
                                type="submit"
                                class="btn btn-sm btn-warning">

                            Очистить

                        </button>

                    </form>

                </th>

            </tr>

            </tfoot>

        </table>


        <div class="mt-3">

            <a
                    th:href="@{/products}"
                    class="btn btn-secondary">

                Продолжить покупки

            </a>


            <a
                    th:href="@{/checkout}"
                    class="btn btn-success float-end">

                Оформить заказ

            </a>

        </div>

    </div>

</div>

</body>
</html>
