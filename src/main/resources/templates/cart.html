<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">

<body>

<div th:fragment="content">

    <div class="cart-page">

        <header class="cart-header">
            <div class="cart-label">Marketplace</div>

            <h1 class="cart-title">
                Корзина
            </h1>
        </header>

        <div th:if="${items.isEmpty()}"
             class="empty-cart">

            <div class="empty-cart-icon">
                🛒
            </div>

            <h2 class="empty-cart-title">
                Ваша корзина пуста
            </h2>

            <p class="empty-cart-text">
                Добавьте товары, чтобы оформить заказ.
            </p>

            <a th:href="@{/products}"
               class="primary-button">
                Перейти к товарам
            </a>

        </div>

        <div th:unless="${items.isEmpty()}"
             class="cart-content">

            <div class="cart-table-wrapper">

                <table class="table cart-table">

                    <thead>
                    <tr>
                        <th>Товар</th>
                        <th>Цена</th>
                        <th>Количество</th>
                        <th>Сумма</th>
                        <th>Действие</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="item : ${items}">

                        <td class="cart-product-name"
                            th:text="${item.productName}">
                            Товар
                        </td>

                        <td class="cart-price"
                            th:text="${'$' + item.price}">
                            $99.99
                        </td>

                        <td>

                            <form th:action="@{/cart/update}"
                                  method="post"
                                  class="cart-quantity-form">

                                <input type="hidden"
                                       name="productId"
                                       th:value="${item.productId}">

                                <input type="number"
                                       name="quantity"
                                       th:value="${item.quantity}"
                                       min="1"
                                       max="99"
                                       class="form-control cart-quantity-input">

                                <button type="submit"
                                        class="cart-update-button">
                                    Обновить
                                </button>

                            </form>

                        </td>

                        <td class="cart-price"
                            th:text="${'$' + item.total}">
                            $199.98
                        </td>

                        <td>

                            <form th:action="@{/cart/remove/{id}(id=${item.productId})}"
                                  method="post">

                                <button type="submit"
                                        class="remove-button">
                                    Удалить
                                </button>

                            </form>

                        </td>

                    </tr>

                    </tbody>

                    <tfoot>

                    <tr>

                        <th colspan="3">
                            Итого:
                        </th>

                        <th class="cart-total"
                            th:text="${'$' + total}">
                            $0.00
                        </th>

                        <th>

                            <form th:action="@{/cart/clear}"
                                  method="post">

                                <button type="submit"
                                        class="clear-button">
                                    Очистить
                                </button>

                            </form>

                        </th>

                    </tr>

                    </tfoot>

                </table>

            </div>

            <div class="cart-actions">

                <div class="cart-actions-left">

                    <a th:href="@{/products}"
                       class="secondary-button">
                        Продолжить покупки
                    </a>

                </div>

                <div class="cart-actions-right">

                    <a th:href="@{/checkout}"
                       class="primary-button">
                        Оформить заказ
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
