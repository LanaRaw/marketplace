<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(content)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${title} ?: 'Маркетплейс'">
        Маркетплейс
    </title>

    <link rel="shortcut icon" href="/favicon.ico">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
            rel="stylesheet">

    <link
            href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap"
            rel="stylesheet">

    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">
</head>

<body>

<nav class="navbar navbar-expand-lg site-navbar">
    <div class="container">

        <a class="navbar-brand" th:href="@{/}">
            Маркетплейс
        </a>

        <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Переключить навигацию">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item"
                    th:if="${#authorization.expression('isAuthenticated()')}">

                    <span class="user-greeting">
                        Привет,
                        <span th:text="${#authentication.name}">user</span>
                    </span>

                </li>

                <li class="nav-item position-relative">

                    <a class="nav-link nav-action"
                       th:href="@{/cart}">

                        Корзина

                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger cart-badge"
                              th:text="${cartService != null ? cartService.getTotalItems() : 0}">
                            0
                        </span>

                    </a>

                </li>

                <li class="nav-item"
                    th:if="${#authorization.expression('isAuthenticated()')}">

                    <a class="nav-link"
                       th:href="@{/orders/history}">
                        Мои заказы
                    </a>

                </li>

                <li class="nav-item"
                    th:if="${#authorization.expression('isAuthenticated()')}">

                    <a class="nav-link"
                       th:href="@{/logout}">
                        Выход
                    </a>

                </li>

                <li class="nav-item"
                    th:unless="${#authorization.expression('isAuthenticated()')}">

                    <a class="nav-link"
                       th:href="@{/login}">
                        Вход
                    </a>

                </li>

                <li class="nav-item"
                    th:unless="${#authorization.expression('isAuthenticated()')}">

                    <a class="nav-link nav-primary"
                       th:href="@{/register}">
                        Регистрация
                    </a>

                </li>

            </ul>

        </div>
    </div>
</nav>

<main class="page-content"
      th:replace="${content}">
</main>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
