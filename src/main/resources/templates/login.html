<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">

<body>

<div th:fragment="content">

    <div class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <span class="auth-label">
                    Account
                </span>

                <h1 class="auth-title">
                    Вход в систему
                </h1>

                <p class="auth-subtitle">
                    Войдите в свой аккаунт, чтобы продолжить.
                </p>

            </div>

            <div th:if="${param.error}"
                 class="auth-alert auth-alert-error">
                Неверный email или пароль
            </div>

            <div th:if="${param.registered}"
                 class="auth-alert auth-alert-success">
                Регистрация успешна! Войдите в систему.
            </div>

            <div th:if="${param.logout}"
                 class="auth-alert auth-alert-info">
                Вы вышли из системы
            </div>

            <form th:action="@{/login}"
                  method="post"
                  class="auth-form">

                <div class="auth-field">

                    <label for="username"
                           class="auth-label-text">
                        Email
                    </label>

                    <input type="email"
                           class="form-control auth-input"
                           id="username"
                           name="username"
                           required>

                </div>

                <div class="auth-field">

                    <label for="password"
                           class="auth-label-text">
                        Пароль
                    </label>

                    <input type="password"
                           class="form-control auth-input"
                           id="password"
                           name="password"
                           required>

                </div>

                <button type="submit"
                        class="auth-submit">
                    Войти
                </button>

            </form>

            <div class="auth-footer">
                Нет аккаунта?
                <a th:href="@{/register}">
                    Зарегистрироваться
                </a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
